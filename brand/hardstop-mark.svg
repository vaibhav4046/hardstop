<svg xmlns="http://www.w3.org/2000/svg" viewBox="-395 -285 785 570" width="3920" height="2846">
  <title>HARDSTOP</title>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="-300" y1="-280" x2="300" y2="280">
      <stop offset="0" stop-color="#8a5f1c"/>
      <stop offset="0.28" stop-color="#d9a441"/>
      <stop offset="0.48" stop-color="#ffe08f"/>
      <stop offset="0.7" stop-color="#c99231"/>
      <stop offset="1" stop-color="#6f4914"/>
    </linearGradient>
    <mask id="ring" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800">
      <circle r="270" fill="#fff"/>
