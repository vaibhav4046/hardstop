name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FE_VERSION: v26.6.0
  # sha256 of the release asset fe_linux_amd64 for FE_VERSION, so the compiler
  # that produces the "the compiler refuses" evidence cannot change underneath it.
  FE_SHA256: 697081cb9265bd1be7a5d33e6bb0c8559ee5ff542abab9a046540fc151b4edaa

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe (pinned release binary, checksum verified)
        run: |
          mkdir -p "$HOME/.fe/bin"
          curl -fsSL -o "$HOME/.fe/bin/fe" "https://github.com/argotorg/fe/releases/download/$FE_VERSION/fe_linux_amd64"
          echo "$FE_SHA256  $HOME/.fe/bin/fe" | sha256sum -c -
          chmod +x "$HOME/.fe/bin/fe"
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version

      - name: Format
        working-directory: fe
        run: fe fmt --check
      - name: Fe tests on the EVM
        working-directory: fe
        run: fe test
      - name: The same kernel and adversary tests, natively
        working-directory: fe
        run: fe test --backend native
      - name: Build the contracts
        working-directory: fe
        run: fe build --emit bytecode,runtime-bytecode,abi
      - name: Pay cannot be edited to change the rules (the compiler refuses)
        run: bash scripts/pay-cannot-loosen.sh
      - name: Build the native tool
        working-directory: fe
        run: fe build --backend native
      - name: Native campaign, 20,000 games of 40 requests
        working-directory: fe
        run: ./out/hardstop campaign 5206533097626292048 20000 40

      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: The committed web artifacts are what this source compiles to
        run: |
          node scripts/sync-artifacts.mjs
          git diff --exit-code -- web/src/lib/hardstop/artifacts.ts
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: The committed one-file MCP server is what this source bundles to
        working-directory: web
        run: |
          node scripts/bundle-mcp.mjs
          git diff --exit-code -- mcp/dist/hardstop-mcp.mjs
      - name: Vault bytecode vs native kernel, and time-travel tests
        working-directory: web
        run: npm test
      - name: Type-check
        working-directory: web
        run: npx next typegen && npx tsc --noEmit

  # The two compiler patches in research/fe-patches, applied to Fe master at the
  # commit they were written against: the compiler's own UI tests for them, then
  # HARDSTOP's tests and refusal script on the patched compiler, which must refuse
  # the forged `Call` and `Ctx` that compile on 26.6. The contracts are still built
  # with the release above, not with this compiler.
  patched-fe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FE_BASE: 6cd57cc622144bbbd4d82f62361e39150b145021
    steps:
      - uses: actions/checkout@v5
      - name: Fe master at the patches' base, with the patches applied
        run: |
          git init -q fe-src
          cd fe-src
          git fetch -q --depth 1 https://github.com/argotorg/fe "$FE_BASE"
          git checkout -q FETCH_HEAD
          git -c user.name=ci -c user.email=ci@localhost am -q ../research/fe-patches/*.patch
          git log --format='%h %s' -3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: The tree-sitter CLI Fe's build runs (its own lockfile)
        working-directory: fe-src/crates/tree-sitter-fe
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fe-src
      - name: Build the patched compiler
        working-directory: fe-src
        run: cargo build --release -p fe
      - name: The patches' UI tests (name resolution, type checking)
        working-directory: fe-src
        run: cargo test --release -p fe-uitest --test name_resolution --test ty_check
      - name: HARDSTOP's Fe tests on the patched compiler
        working-directory: fe
        run: ../fe-src/target/release/fe test
      - name: Refusal script on the patched compiler (both forgeries refused at the seal)
        shell: bash
        run: |
          FE="$PWD/fe-src/target/release/fe" bash scripts/pay-cannot-loosen.sh | tee refusal.log
          test "$(grep -c 'this compiler checks the seal' refusal.log)" = 2

  # The browser suite (web/e2e) against the production build. playwright.config.ts
  # retries a failed test once when CI is set; one that passes on the retry is
  # listed as "flaky" in the log, not hidden.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the site
        run: npm run build
      - name: Browser suite (personas, accessibility, navigation, live)
        run: npx playwright test --project=suite
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/suite
      - name: Performance, alone after the suite
        id: perf
        # The committed perf-*.json come from a local machine; remove them so the
        # next step can only print numbers measured on this runner.
        run: |
          rm -f ../qa/metrics/perf-*.json
          npx playwright test --project=perf --no-deps --output test-results/perf
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/perf
      - name: Performance numbers measured on this runner
        if: ${{ !cancelled() && steps.perf.outcome != 'skipped' }}
        run: |
          shopt -s nullglob
          files=(../qa/metrics/perf-*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "No performance numbers were written."; exit 0; fi
          { echo '## Performance on the GitHub runner'; echo; echo 'Measured by web/e2e/performance.spec.ts on this run, not the numbers committed in qa/metrics.'; } >> "$GITHUB_STEP_SUMMARY"
          for f in "${files[@]}"; do
            echo "== $(basename "$f")"; cat "$f"
            { echo; echo "### $(basename "$f")"; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload the HTML report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
