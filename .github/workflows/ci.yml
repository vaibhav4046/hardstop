name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FE_VERSION: v26.6.0

jobs:
  fe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - run: fe fmt --check
      - name: Tests on the EVM
        run: fe test
      - name: The same kernel and adversary tests, natively
        run: fe test --backend native
      - name: Build the contracts
        run: fe build --emit bytecode,runtime-bytecode,abi
      - name: Build the native tool
        run: fe build --backend native
      - name: Native campaign, 20,000 games of 40 requests
        run: ./out/hardstop campaign 5206533097626292048 20000 40
